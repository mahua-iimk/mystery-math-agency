<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mystery Math Agency</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-cyan: #00f0ff;
            --dark-bg: #020617;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--dark-bg);
            color: white;
            user-select: none;
        }
        .orbitron { font-family: 'Orbitron', sans-serif; }
        
        .glass-panel {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 240, 255, 0.2);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.05);
        }

        .btn-neon {
            background: transparent; color: var(--neon-cyan); border: 2px solid var(--neon-cyan);
            text-transform: uppercase; letter-spacing: 2px; transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2), inset 0 0 10px rgba(0, 240, 255, 0.2);
        }
        .btn-neon:hover {
            background: var(--neon-cyan); color: var(--dark-bg);
            box-shadow: 0 0 20px var(--neon-cyan), inset 0 0 20px var(--neon-cyan);
            transform: scale(1.02);
        }

        .numpad-btn {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.1s; display: flex; align-items: center; justify-content: center;
        }
        .numpad-btn:active { background: var(--neon-cyan); color: black; transform: scale(0.95); }

        .screen { display: none; }
        .screen.active { display: flex; }

        /* Circuit Map */
        .node circle { transition: all 0.4s ease; }
        .node text { transition: all 0.4s ease; font-family: 'Orbitron', sans-serif; font-weight: bold; }
        
        .node.locked circle { fill: #0f172a; stroke: #1e293b; stroke-width: 3; }
        .node.locked text { fill: #475569; }
        
        .node.active circle { 
            fill: #020617; stroke: var(--neon-cyan); stroke-width: 4;
            filter: drop-shadow(0 0 8px var(--neon-cyan));
        }
        .node.active text { fill: var(--neon-cyan); }
        
        .node.completed circle { 
            fill: var(--neon-cyan); stroke: white; stroke-width: 2; 
            filter: drop-shadow(0 0 8px var(--neon-cyan));
        }
        .node.completed text { fill: #000; }
        
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .agent-bot { animation: bounce 3s infinite ease-in-out; }
    </style>
</head>
<body class="min-h-screen flex flex-col p-2 md:p-6 overflow-x-hidden">

    <!-- Header -->
    <header class="w-full max-w-6xl mx-auto flex justify-between items-center mb-4 shrink-0 px-2">
        <h1 class="text-xl md:text-3xl font-black tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500 uppercase orbitron">
            M.M.A. Terminal
        </h1>
        <div class="orbitron text-yellow-400 font-bold">SCORE: <span id="score-display">0</span></div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 w-full max-w-6xl mx-auto flex flex-col md:flex-row gap-4 min-h-0 shrink-0">
        
        <!-- LEFT PANEL: Briefing & Puzzles -->
        <div class="flex-1 glass-panel rounded-2xl flex flex-col overflow-hidden relative">
            
            <!-- Briefing Screen -->
            <div id="screen-briefing" class="screen active flex-col h-full items-center justify-center p-6 text-center">
                <!-- Agent Byte SVG -->
                <div class="agent-bot w-32 h-32 md:w-48 md:h-48 shrink-0 mb-6">
                    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" class="w-full h-full drop-shadow-[0_0_15px_rgba(0,240,255,0.5)]">
                        <!-- Antenna -->
                        <line x1="100" y1="20" x2="100" y2="50" stroke="#00f0ff" stroke-width="4"/>
                        <circle cx="100" cy="15" r="8" fill="#ff003c" />
                        <!-- Head -->
                        <rect x="50" y="50" width="100" height="80" rx="15" fill="#0f172a" stroke="#00f0ff" stroke-width="5"/>
                        <!-- Screen -->
                        <rect x="65" y="65" width="70" height="50" rx="5" fill="#020617"/>
                        <!-- Eyes -->
                        <circle cx="80" cy="90" r="8" fill="#00f0ff" />
                        <circle cx="120" cy="90" r="8" fill="#00f0ff" />
                        <!-- Neck/Body -->
                        <path d="M 80 130 L 120 130 L 110 170 L 90 170 Z" fill="#0f172a" stroke="#00f0ff" stroke-width="4"/>
                    </svg>
                </div>
                <h2 class="text-2xl md:text-4xl orbitron font-bold text-cyan-400 mb-4 shrink-0">AGENT BYTE</h2>
                <div class="bg-slate-900/80 border border-slate-700 p-4 rounded-xl max-w-md w-full mb-8 shrink-0 shadow-inner">
                    <p class="text-lg md:text-xl text-slate-300 font-mono">
                        "Solve the problems, get solutions, move ahead."
                    </p>
                </div>
                <button onclick="startGame()" class="btn-neon px-8 py-4 text-xl font-bold rounded-xl shrink-0">
                    ACCEPT MISSION
                </button>
            </div>

            <!-- Puzzle Screen -->
            <div id="screen-puzzle" class="screen flex-col h-full p-4 md:p-6">
                <!-- Header -->
                <div class="text-center mb-2 shrink-0">
                    <div id="puzzle-badge" class="inline-block px-3 py-1 bg-cyan-950 text-cyan-400 border border-cyan-800 rounded-full orbitron text-xs md:text-sm mb-2">STAGE 1</div>
                    <h2 id="puzzle-title" class="text-xl md:text-2xl font-bold orbitron text-white">Title</h2>
                </div>
                
                <!-- Visual Area -->
                <div class="flex-1 w-full bg-slate-950 border border-slate-800 rounded-xl flex items-center justify-center p-4 mb-4 shadow-inner min-h-[150px]">
                    <div id="puzzle-visual" class="text-center text-lg md:text-2xl tracking-widest">
                        <!-- Content -->
                    </div>
                </div>

                <!-- Input & Numpad -->
                <div class="w-full bg-slate-900/50 p-4 rounded-xl border border-cyan-900/50 shrink-0">
                    <div class="flex flex-col sm:flex-row gap-4">
                        <div class="flex-1 flex flex-col justify-end">
                            <label class="text-xs text-cyan-500 mb-1 orbitron">INPUT CODE:</label>
                            <div id="input-display" class="w-full h-12 bg-black border border-slate-600 rounded-lg flex items-center justify-end px-4 text-2xl orbitron text-cyan-400 tracking-wider">
                                <span class="animate-pulse text-slate-600">_</span>
                            </div>
                            <button onclick="checkAnswer()" class="btn-neon w-full py-3 mt-3 rounded-lg font-bold">SUBMIT</button>
                            <div id="feedback-msg" class="text-center text-sm mt-2 font-bold h-4"></div>
                        </div>
                        <div class="w-full sm:w-48 grid grid-cols-3 gap-2 shrink-0">
                            <button class="numpad-btn h-10 md:h-12 rounded-lg text-lg orbitron" onclick="typeNum(1)">1</button>
                            <button class="numpad-btn h-10 md:h-12 rounded-lg text-lg orbitron" onclick="typeNum(2)">2</button>
                            <button class="numpad-btn h-10 md:h-12 rounded-lg text-lg orbitron" onclick="typeNum(3)">3</button>
                            <button class="numpad-btn h-10 md:h-12 rounded-lg text-lg orbitron" onclick="typeNum(4)">4</button>
                            <button class="numpad-btn h-10 md:h-12 rounded-lg text-lg orbitron" onclick="typeNum(5)">5</button>
                            <button class="numpad-btn h-10 md:h-12 rounded-lg text-lg orbitron" onclick="typeNum(6)">6</button>
                            <button class="numpad-btn h-10 md:h-12 rounded-lg text-lg orbitron" onclick="typeNum(7)">7</button>
                            <button class="numpad-btn h-10 md:h-12 rounded-lg text-lg orbitron" onclick="typeNum(8)">8</button>
                            <button class="numpad-btn h-10 md:h-12 rounded-lg text-lg orbitron" onclick="typeNum(9)">9</button>
                            <button class="numpad-btn h-10 md:h-12 rounded-lg text-lg orbitron text-red-400" onclick="clearInput()">C</button>
                            <button class="numpad-btn h-10 md:h-12 rounded-lg text-lg orbitron" onclick="typeNum(0)">0</button>
                            <button class="numpad-btn h-10 md:h-12 rounded-lg text-lg orbitron text-slate-400" onclick="deleteNum()">←</button>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Win Screen -->
            <div id="screen-win" class="screen flex-col h-full items-center justify-center p-6 text-center">
                <div class="w-24 h-24 rounded-full bg-yellow-500/20 border-4 border-yellow-400 flex items-center justify-center text-yellow-400 shadow-[0_0_30px_#facc15] mb-6">
                    <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"></path></svg>
                </div>
                <h2 class="text-4xl orbitron font-black text-yellow-400 mb-4">MISSION COMPLETE</h2>
                <p class="text-xl text-slate-300 mb-8">Master Detective Badge Unlocked.</p>
                <button onclick="location.reload()" class="btn-neon px-8 py-3 rounded-lg font-bold border-yellow-400 text-yellow-400">PLAY AGAIN</button>
            </div>
        </div>

        <!-- RIGHT PANEL: Circuit Map -->
        <div class="w-full md:w-64 lg:w-80 glass-panel rounded-2xl p-4 md:p-6 flex flex-col shrink-0 min-h-[300px] md:min-h-0">
            <h3 class="orbitron text-center text-cyan-400 border-b border-cyan-900/50 pb-3 mb-4 tracking-widest shrink-0">MISSION PROGRESS</h3>
            <div class="flex-1 w-full relative flex items-center justify-center overflow-hidden">
                <svg viewBox="0 0 100 500" class="w-full h-full object-contain" preserveAspectRatio="xMidYMid meet">
                    <!-- Base Path -->
                    <path d="M 50 20 L 50 480" stroke="#1e293b" stroke-width="4" fill="none"/>
                    
                    <!-- Nodes (1 Top to 6 Bottom) -->
                    <g id="node-1" class="node active" transform="translate(50, 40)">
                        <circle cx="0" cy="0" r="16" />
                        <text x="0" y="5" text-anchor="middle" font-size="14">1</text>
                    </g>
                    <g id="node-2" class="node locked" transform="translate(50, 120)">
                        <circle cx="0" cy="0" r="16" />
                        <text x="0" y="5" text-anchor="middle" font-size="14">2</text>
                    </g>
                    <g id="node-3" class="node locked" transform="translate(50, 200)">
                        <circle cx="0" cy="0" r="16" />
                        <text x="0" y="5" text-anchor="middle" font-size="14">3</text>
                    </g>
                    <g id="node-4" class="node locked" transform="translate(50, 280)">
                        <circle cx="0" cy="0" r="16" />
                        <text x="0" y="5" text-anchor="middle" font-size="14">4</text>
                    </g>
                    <g id="node-5" class="node locked" transform="translate(50, 360)">
                        <circle cx="0" cy="0" r="16" />
                        <text x="0" y="5" text-anchor="middle" font-size="14">5</text>
                    </g>
                    <g id="node-6" class="node locked" transform="translate(50, 440)">
                        <circle cx="0" cy="0" r="20" />
                        <text x="0" y="6" text-anchor="middle" font-size="16">6</text>
                    </g>
                </svg>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full max-w-6xl mx-auto mt-4 px-4 py-4 glass-panel rounded-xl flex flex-col md:flex-row justify-between items-center text-xs md:text-sm text-cyan-500/80 orbitron shrink-0 gap-2 md:gap-0">
        <div>
            ACTIVE AGENTS: <span id="active-agents" class="text-cyan-300 font-bold transition-all duration-300 inline-block">--</span>
        </div>
        <div class="text-slate-400 font-sans tracking-widest uppercase">
            Ideated by <span class="text-cyan-400 font-bold">Mahua Banerjee</span>
        </div>
        <div>
            BADGES AWARDED: <span id="badges-awarded" class="text-yellow-400 font-bold">--</span>
        </div>
    </footer>

    <!-- Logic with Firebase Integration -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, onSnapshot, increment } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // ==============================================================================
        // 1. FIREBASE CONFIGURATION - PASTE YOUR REAL DETAILS HERE
        // ==============================================================================
        const fallbackConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        
        // Use environment configs if injected, otherwise fallback to user-pasted config above
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : fallbackConfig;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'mystery-math-agency';

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let user = null;
        let statsDocRef = null;

        async function initAuth() {
            try {
                if (typeof __initial_auth_token !== 'undefined') {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                user = auth.currentUser;
                
                // Set path following strict rules: /artifacts/{appId}/public/data/{collectionName}
                statsDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'stats', 'global');
                
                // Initialize the tracking document if it's the first time running
                const snap = await getDoc(statsDocRef);
                if (!snap.exists()) {
                    await setDoc(statsDocRef, { badgesAwarded: 0, activeAgents: 0 });
                }

                // Safely Increment active agents when someone joins
                await updateDoc(statsDocRef, { activeAgents: increment(1) });

                // Listen for live updates and update the UI
                onSnapshot(statsDocRef, (docSnap) => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        document.getElementById('active-agents').innerText = Math.max(0, data.activeAgents || 0);
                        document.getElementById('badges-awarded').innerText = data.badgesAwarded || 0;
                    }
                }, (error) => {
                    console.error("Error connecting to real-time stats:", error);
                });

                // Decrement active agents when someone closes the tab
                window.addEventListener('beforeunload', () => {
                    if (user && statsDocRef) {
                        updateDoc(statsDocRef, { activeAgents: increment(-1) });
                    }
                });

            } catch (e) {
                console.error("Firebase Authentication Error:", e);
            }
        }
        
        // Safety check so the game doesn't crash if Firebase credentials aren't pasted yet
        if (firebaseConfig.apiKey !== "YOUR_API_KEY") {
            initAuth();
        } else {
            console.warn("Firebase config missing. Live tracking disabled. Set config at the top of the script.");
            document.getElementById('active-agents').innerText = "1";
            document.getElementById('badges-awarded').innerText = "0";
        }

        // ==============================================================================
        // 2. GAME LOGIC & UI (Exported to window to bypass module scoping)
        // ==============================================================================
        
        const puzzles = [
            {
                type: "Number Sequence", title: "Olympiad Pattern",
                html: `<div class="font-mono text-xl md:text-2xl">3 &rarr; 7 &rarr; 15 &rarr; 31 &rarr; <span class="text-cyan-400">[ ? ]</span></div>`,
                answer: "63", xp: 100
            },
            {
                type: "Substitution", title: "Algebraic Deduction",
                html: `<div class="space-y-2 text-xl font-mono"><div>🍎 + 🍎 = 10</div><div>🍎 + 🍌 = 9</div><div>🍌 + 🍇 = 10</div><div class="text-yellow-400 mt-2">🍇 = [ ? ]</div></div>`,
                answer: "6", xp: 150
            },
            {
                type: "Spatial Logic", title: "Magic Grid",
                html: `<div class="grid grid-cols-3 gap-2 w-48 mx-auto font-mono text-xl"><div class="bg-slate-800 py-2 rounded">8</div><div class="bg-slate-800 py-2 rounded">1</div><div class="bg-slate-800 py-2 rounded">6</div><div class="bg-slate-800 py-2 rounded">3</div><div class="bg-cyan-900 border border-cyan-400 py-2 rounded text-cyan-400">[?]</div><div class="bg-slate-800 py-2 rounded">7</div><div class="bg-slate-800 py-2 rounded">4</div><div class="bg-slate-800 py-2 rounded">9</div><div class="bg-slate-800 py-2 rounded">2</div></div>`,
                answer: "5", xp: 200
            },
            {
                type: "Algebra", title: "Geometric Equations",
                html: `<div class="space-y-2 text-xl font-mono"><div>🔺 + ⬛ = 12</div><div>🔺 = ⬛ + ⬛</div><div class="text-yellow-400 mt-2">⬛ = [ ? ]</div></div>`,
                answer: "4", xp: 250
            },
            {
                type: "Number Theory", title: "LCM Deduction",
                html: `<div class="text-xl font-mono"><span class="text-purple-400">LCM( 6 , 8 )</span> = <span class="text-yellow-400">[ ? ]</span></div>`,
                answer: "24", xp: 300
            },
            {
                type: "Cryptography", title: "Cipher Intercept",
                html: `<div class="text-lg font-mono"><p class="text-sm text-slate-400 mb-2">A=1, B=2, C=3...</p><div>CAB = 3+1+2 = 6</div><div class="text-yellow-400 mt-2">BAD = [ ? ]</div></div>`,
                answer: "7", xp: 400
            }
        ];

        let currentStage = 0;
        let score = 0;
        let inputVal = "";

        const screens = document.querySelectorAll('.screen');
        const inputDisplay = document.getElementById('input-display');
        const msg = document.getElementById('feedback-msg');

        window.startGame = function() {
            currentStage = 0;
            score = 0;
            updateMap();
            loadStage();
            showScreen('screen-puzzle');
        }

        function loadStage() {
            if(currentStage >= puzzles.length) {
                showScreen('screen-win');
                return;
            }
            const p = puzzles[currentStage];
            document.getElementById('puzzle-badge').innerText = `STAGE ${currentStage + 1}: ${p.type.toUpperCase()}`;
            document.getElementById('puzzle-title').innerText = p.title;
            document.getElementById('puzzle-visual').innerHTML = p.html;
            window.clearInput();
            msg.innerText = "";
        }

        window.typeNum = function(n) { if(inputVal.length < 5) { inputVal += n; renderInput(); } }
        window.deleteNum = function() { inputVal = inputVal.slice(0, -1); renderInput(); }
        window.clearInput = function() { inputVal = ""; renderInput(); }
        
        function renderInput() {
            inputDisplay.innerHTML = inputVal === "" ? `<span class="animate-pulse text-slate-600">_</span>` : inputVal;
            msg.innerText = "";
        }

        window.checkAnswer = async function() {
            if(inputVal === "") return;
            const p = puzzles[currentStage];
            
            if(inputVal === p.answer) {
                msg.innerText = "ACCESS GRANTED";
                msg.className = "text-center text-sm mt-2 font-bold h-4 text-cyan-400";
                score += p.xp;
                document.getElementById('score-display').innerText = score;
                
                // If this is the very last stage, update the permanent Database badge tracker
                if(currentStage === puzzles.length - 1 && user && statsDocRef) {
                    try {
                        await updateDoc(statsDocRef, { badgesAwarded: increment(1) });
                    } catch (e) {
                        console.error("Could not upload badge award to database:", e);
                    }
                }

                setTimeout(() => {
                    currentStage++;
                    updateMap();
                    loadStage();
                }, 1000);
            } else {
                msg.innerText = "ACCESS DENIED";
                msg.className = "text-center text-sm mt-2 font-bold h-4 text-red-500";
                window.clearInput();
            }
        }

        function updateMap() {
            for(let i=1; i<=6; i++) {
                const node = document.getElementById(`node-${i}`);
                node.className.baseVal = "node ";
                if(i < currentStage + 1) node.className.baseVal += "completed";
                else if(i === currentStage + 1) node.className.baseVal += "active";
                else node.className.baseVal += "locked";
            }
        }

        function showScreen(id) {
            screens.forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }
    </script>
</body>
</html>
